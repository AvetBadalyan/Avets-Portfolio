<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme Color - Purple accent -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="msapplication-TileColor" content="#8B5CF6" />

    <!-- Primary Meta Tags -->
    <title>Avet Badalyan | Frontend Engineer & Full Stack Developer</title>
    <meta
      name="title"
      content="Avet Badalyan | Frontend Engineer & Full Stack Developer"
    />
    <meta
      name="description"
      content="Frontend Engineer with 3+ years building scalable web apps. React, TypeScript, Node.js, Shopify. Currently at EPAM Systems. View 21 live projects."
    />
    <meta name="author" content="Avet Badalyan" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avets-portfolio.web.app/" />
    <meta
      property="og:title"
      content="Avet Badalyan | Frontend Engineer & Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Frontend Engineer with 3+ years building scalable web apps. React, TypeScript, Node.js, Shopify. View 21 live projects including MERN apps and published Shopify themes."
    />
    <meta
      property="og:image"
      content="https://avets-portfolio.web.app/portfolio-preview.jpg"
    />
    <meta property="og:site_name" content="Avet Badalyan Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://avets-portfolio.web.app/" />
    <meta
      name="twitter:title"
      content="Avet Badalyan | Frontend Engineer & Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Frontend Engineer with 3+ years building scalable web apps. React, TypeScript, Node.js, Shopify. View 21 live projects."
    />
    <meta
      name="twitter:image"
      content="https://avets-portfolio.web.app/portfolio-preview.jpg"
    />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#8B5CF6" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts without blocking first paint: fetch the stylesheet as
         a non-render-blocking resource, then flip it to media="all" once loaded.
         The <noscript> keeps fonts working when JS is disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      />
    </noscript>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://avets-portfolio.web.app/" />

    <!-- Critical above-the-fold CSS inlined to eliminate render-blocking.
         Covers: CSS custom properties, box-sizing reset, html/body baseline,
         and the initial loader — everything needed to paint the first frame.
         The full stylesheet (loaded by Vite's <script type="module">) will
         override these once it arrives, with no visual flash. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 62.5%;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        font-family: "Roboto", sans-serif;
        font-weight: 400;
        line-height: 1.7;
        font-size: 1.6rem;
        background: #0f0f14;
      }
      :root {
        --primary-hue: 270;
        --color-primary-saturation: 89%;
        --color-primary-lightness: 36%;
        --color-accent-saturation: 89%;
        --color-accent-lightness: 36%;
        --color-on-primary: #fff;
        --color-accent: hsl(270, 89%, 36%);
        --color-white: hsl(0, 5%, 100%);
        --color-black: hsl(270, 5%, 15%);
        --color-dark: hsl(270, 5%, 38%);
        --color-light: hsl(270, 5%, 94%);
        --font-family-body: "Roboto", sans-serif;
        --font-family-display: "Inter", sans-serif;
        --duration-slow: 500ms;
        --easing-default: ease;
        --shadow-strength: 1;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f14;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading screen (shows until React hydrates) -->
    <div id="root">
      <div
        id="initial-loader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f0f14;
          z-index: 9999;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "
        ></div>
        <style>
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Theme Color - Purple accent -->
    <meta name="theme-color" content="#8B5CF6" />

    <!-- Primary Meta Tags -->

    <meta

    <meta property="og:site_name" content="Avet Badalyan Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://avets-portfolio.web.app/" />
    <meta
      name="twitter:title"
      content="Avet Badalyan | Frontend Engineer & Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Frontend Engineer with 3+ years building scalable web apps. React, TypeScript, Node.js, Shopify. View 21 live projects."
    />
    <meta
      name="twitter:image"
      content="https://avets-portfolio.web.app/portfolio-preview.jpg"
    />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#8B5CF6" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts without blocking first paint: fetch the stylesheet as
         a non-render-blocking resource, then flip it to media="all" once loaded.
         The <noscript> keeps fonts working when JS is disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      />
    </noscript>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://avets-portfolio.web.app/" />

    <!-- Critical above-the-fold CSS inlined to eliminate render-blocking.
         Covers: CSS tokens, box-sizing reset, html/body baseline, the initial
         loader, the navbar shell, and the hero section's first-paint layout.
         Everything here uses only static values (no var() references to tokens
         not yet defined) so the browser can paint the above-fold frame before
         Vite's injected CSS bundle arrives.
         The full stylesheet will override these once it arrives with no flash. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 62.5%;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        font-family: "Roboto", sans-serif;
        font-weight: 400;
        line-height: 1.7;
        font-size: 1.6rem;
        background: #0f0f14;
      }
      :root {
        --primary-hue: 270;
        --color-primary-saturation: 89%;
        --color-primary-lightness: 36%;
        --color-accent-saturation: 89%;
        --color-accent-lightness: 36%;
        --color-on-primary: #fff;
        --color-accent: hsl(270, 89%, 36%);
        --color-white: hsl(0, 5%, 100%);
        --color-black: hsl(270, 5%, 15%);
        --color-dark: hsl(270, 5%, 38%);
        --color-light: hsl(270, 5%, 94%);
        --font-family-body: "Roboto", sans-serif;
        --font-family-display: "Inter", sans-serif;
        --duration-slow: 500ms;
        --easing-default: ease;
        --shadow-strength: 1;
        /* glass tokens needed by navbar on first paint */
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-bg-solid: rgba(255, 255, 255, 0.85);
        --glass-border: hsla(270, 20%, 30%, 0.18);
        --glass-blur: 20px;
        /* spacing tokens used by navbar/hero layout */
        --space-sm: 1.2rem;
        --space-md: 1.6rem;
        --space-lg: 2rem;
        --space-xl: 2.4rem;
        --space-2xl: 3.2rem;
        --space-3xl: 4rem;
        --space-4xl: 4.8rem;
        --space-5xl: 6.4rem;
        --space-6xl: 8rem;
        --container-max: 136rem;
        --container-padding: 3.2rem;
        --z-navbar: 100;
        --border-radius-3: 0.8rem;
        --border-radius-pill: 100px;
        --icon-size-md: 2rem;
        --icon-size-lg: 2.4rem;
        --icon-size-xl: 2.8rem;
        --fw-bold: 700;
        --fw-semibold: 600;
        --fw-medium: 500;
        --fw-extrabold: 800;
        --font-size-base: 1.6rem;
        --font-size-md: 1.8rem;
        --font-size-xl: 2.4rem;
        --tracking-display: -0.02em;
        --tracking-wide: 0.05em;
      }
      /* ── Navbar shell ── */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 8rem;
        z-index: 100;
        background: transparent;
      }
      .nav__container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        max-width: 136rem;
        margin: 0 auto;
        padding: 0 3.2rem;
      }
      .nav__logo {
        display: flex;
        align-items: center;
        gap: 1.2rem;
        color: hsl(270, 89%, 36%);
        font-size: 2.4rem;
        text-decoration: none;
      }
      .nav__logo-text {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        letter-spacing: -0.02em;
      }
      .nav__actions {
        display: flex;
        align-items: center;
        gap: 1.6rem;
      }
      .nav__theme-toggle,
      .nav__burger {
        width: 4.4rem;
        height: 4.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid hsla(270, 20%, 30%, 0.18);
        border-radius: 50%;
        color: hsl(270, 89%, 36%);
        font-size: 2rem;
        cursor: pointer;
      }
      /* ── Hero section shell ── */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 12rem 0 6rem;
        background: #f9f9fa; /* matches hsl(0,5%,100%) computed light-mode default */
        overflow: hidden;
      }
      .hero__container {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4.8rem;
        align-items: center;
        max-width: 136rem;
        margin: 0 auto;
        padding: 0 3.2rem;
      }
      @media (max-width: 1024px) {
        .hero {
          padding: 12rem 0 8rem;
        }
        .hero__container {
          grid-template-columns: 1fr;
          text-align: center;
          gap: 4rem;
        }
      }
      @media (max-width: 600px) {
        .hero {
          padding: 10rem 0 4rem;
        }
      }
      .hero__content {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .hero__name {
        font-size: clamp(4rem, 7vw, 6.5rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .hero__role {
        font-size: 2.4rem;
        font-weight: 500;
        color: hsl(270, 5%, 38%);
        min-height: calc(2.4rem * 1.4);
      }
      .hero__image-wrapper {
        position: relative;
        width: 38rem;
        height: 38rem;
      }
      @media (max-width: 1200px) {
        .hero__image-wrapper {
          width: 32rem;
          height: 32rem;
        }
      }
      @media (max-width: 1024px) {
        .hero__image-wrapper {
          width: 30rem;
          height: 30rem;
        }
      }
      @media (max-width: 600px) {
        .hero__image-wrapper {
          width: 26rem;
          height: 26rem;
        }
      }
      @media (max-width: 375px) {
        .hero__image-wrapper {
          width: 22rem;
          height: 22rem;
        }
      }
      .hero__image-container {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        box-shadow:
          0 0 0 4px hsl(270, 89%, 36%),
          0 0 0 8px hsla(270, 70%, 50%, 0.2),
          0 0 60px hsla(270, 70%, 50%, 0.4),
          0 25px 80px rgba(0, 0, 0, 0.25);
      }
      .hero__image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 15%;
      }
      /* ── Container utility ── */
      .container {
        max-width: 136rem;
        margin: 0 auto;
        padding: 0 3.2rem;
      }
      /* ── Initial loader ── */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f14;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading screen (shows until React hydrates) -->
    <div id="root">
      <div
        id="initial-loader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f0f14;
          z-index: 9999;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "
        ></div>
        <style>
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
